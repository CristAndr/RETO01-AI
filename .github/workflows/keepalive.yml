name: Keepalive Render
# El plan gratuito de Render duerme el servicio tras 15 min sin tráfico.
# Define la variable del repositorio RENDER_URL (Settings → Secrets and variables → Actions → Variables).
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    if: ${{ vars.RENDER_URL != '' }}
    steps:
      - run: curl -fsS --max-time 90 "${{ vars.RENDER_URL }}/api/health"
